[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-model"
version = "0.1.0"
description = "Audited V-JEPA 2 data, encoder, and loss-injected training infrastructure"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "torch>=2.7,<2.8",
  "torchvision>=0.22,<0.23",
  "torchcodec>=0.5,<0.6",
  "transformers==4.57.6",
  "accelerate==1.15.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
