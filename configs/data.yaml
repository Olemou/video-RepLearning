dataset:
  source_root: source_images
  output_root: dataset
  manifest: dataset/manifest.jsonl
  categories: [clean, cold, warm]
  label_map: {clean: 0, cold: 1, warm: 1}
  conversion_fps: 10.0  # Explicit playback rate; source folders contain no authoritative timing.
  codec: libx264
  resize_policy: letterbox  # Native per-sequence canvas when width/height are omitted.
  clip_length: 64
  sampling_fps: 4.0
  short_video_policy: repeat_last
  validation_sampling: center
  num_workers: 4
  pin_memory: true
  preprocessing:
    crop_size: 256  # Must match facebook/vjepa2-vitl-fpc64-256.
    normalization:
      mode: thermal
      mean: [0.24, 0.24, 0.24]
      std: [0.07, 0.07, 0.07]
